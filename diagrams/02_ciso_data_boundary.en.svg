<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="hostGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cloudGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1c0505" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="460" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">DIAGRAM 2: DATA BOUNDARY FOR CISO &amp; COMPLIANCE</text>
  <text x="460" y="63" text-anchor="middle" fill="#94a3b8" font-size="13">What stays on host (100%) vs what leaves (0 bytes — Zero Network Sockets, Zero Telemetry)</text>

  <!-- Host Machine Safe Boundary (Left) -->
  <g transform="translate(40, 90)" filter="url(#shadowBox)">
    <rect width="520" height="410" rx="14" fill="url(#hostGlow)" stroke="#10b981" stroke-width="2.5"/>
    
    <!-- Header Badge -->
    <rect x="25" y="-12" width="380" height="26" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="215" y="5" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700" letter-spacing="0.6">🔒 AIR-GAPPED WORKSTATION (100% LOCALHOST)</text>

    <!-- Component 1: Local Files -->
    <g transform="translate(30, 40)">
      <rect width="460" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="28" fill="#38bdf8" font-size="13" font-weight="700">Local Evidential Corpus Directory (./corpus)</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">📄 Master Service Agreements, SLA Schedules, Financial Reports (P&amp;L), Invoices</text>
      <text x="20" y="66" fill="#94a3b8" font-size="10.5">State: Local SSD read-only, zero vector indexing to cloud databases</text>
    </g>

    <!-- Bi-directional local pipe -->
    <path d="M 260 125 L 260 160" stroke="#10b981" stroke-width="3" stroke-dasharray="3 3"/>
    <polygon points="255,158 265,158 260,165" fill="#10b981"/>
    <polygon points="255,127 265,127 260,120" fill="#10b981"/>

    <!-- Component 2: Server Process -->
    <g transform="translate(30, 165)">
      <rect width="460" height="95" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="20" y="28" fill="#34d399" font-size="13" font-weight="700">Server Process: mcp-redline (Node.js stdio daemon)</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="11">⚙️ Deterministic concept matching and polarity refutation engine</text>
      <text x="20" y="66" fill="#6ee7b7" font-size="10.5" font-weight="600">✓ 0 open network ports (no listening sockets on 0.0.0.0 / 127.0.0.1)</text>
      <text x="20" y="82" fill="#6ee7b7" font-size="10.5" font-weight="600">✓ 0 telemetry packets, analytics, or document content logging</text>
    </g>

    <!-- Local stdio pipe -->
    <path d="M 260 260 L 260 295" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="255,293 265,293 260,300" fill="#38bdf8"/>
    <polygon points="255,262 265,262 260,255" fill="#38bdf8"/>

    <!-- Component 3: Client Agent -->
    <g transform="translate(30, 300)">
      <rect width="460" height="75" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="26" fill="#38bdf8" font-size="13" font-weight="700">MCP Client / Agent Host (Claude Desktop / Cursor / Terminal CLI)</text>
      <text x="20" y="46" fill="#cbd5e1" font-size="11">Communication: Standard input / output streams (stdin / stdout)</text>
      <text x="20" y="62" fill="#94a3b8" font-size="10.5">Isolated child process on local workstation</text>
    </g>
  </g>

  <!-- Firewall Barrier line -->
  <line x1="600" y1="90" x2="600" y2="500" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="575" y="270" width="50" height="50" rx="25" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="302" text-anchor="middle" fill="#fee2e2" font-size="24">🚫</text>

  <!-- External Public Cloud (Right) -->
  <g transform="translate(630, 90)" filter="url(#shadowBox)">
    <rect width="250" height="410" rx="14" fill="url(#cloudGlow)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Cloud Badge -->
    <rect x="25" y="-12" width="200" height="26" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1"/>
    <text x="125" y="5" text-anchor="middle" fill="#fee2e2" font-size="11" font-weight="700" letter-spacing="0.6">PUBLIC CLOUD</text>

    <!-- Cloud Item 1 -->
    <g transform="translate(20, 50)">
      <rect width="210" height="70" rx="8" fill="#1e1014" stroke="#7f1d1d" stroke-width="1"/>
      <text x="15" y="28" fill="#f87171" font-size="11" font-weight="700">External Vector DBs</text>
      <text x="15" y="48" fill="#fca5a5" font-size="10">Pinecone, Weaviate,</text>
      <text x="15" y="62" fill="#fca5a5" font-size="10">Chroma Cloud, Qdrant</text>
    </g>

    <!-- Cloud Item 2 -->
    <g transform="translate(20, 160)">
      <rect width="210" height="70" rx="8" fill="#1e1014" stroke="#7f1d1d" stroke-width="1"/>
      <text x="15" y="28" fill="#f87171" font-size="11" font-weight="700">Telemetry Endpoints</text>
      <text x="15" y="48" fill="#fca5a5" font-size="10">Segment, PostHog,</text>
      <text x="15" y="62" fill="#fca5a5" font-size="10">Datadog, Google Analytics</text>
    </g>

    <!-- Cloud Item 3 -->
    <g transform="translate(20, 270)">
      <rect width="210" height="70" rx="8" fill="#1e1014" stroke="#7f1d1d" stroke-width="1"/>
      <text x="15" y="28" fill="#f87171" font-size="11" font-weight="700">External Model APIs</text>
      <text x="15" y="48" fill="#fca5a5" font-size="10">OpenAI, Anthropic,</text>
      <text x="15" y="62" fill="#fca5a5" font-size="10">Cohere, Mistral API</text>
    </g>
    
    <text x="125" y="380" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">EGRESS BLOCKED</text>
    <text x="125" y="396" text-anchor="middle" fill="#fca5a5" font-size="9.5">Zero document content</text>
    <text x="125" y="410" text-anchor="middle" fill="#fca5a5" font-size="9.5">leaves the local workstation</text>
  </g>
</svg>
