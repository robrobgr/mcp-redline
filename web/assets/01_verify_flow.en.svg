<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">DIAGRAM 1: VERIFICATION FLOW IN MCP-REDLINE</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Deterministic pipeline from business claim to hard verdict (Zero LLMs in verifier)</text>

  <!-- Input Node -->
  <g transform="translate(250, 95)" filter="url(#shadow)">
    <rect width="400" height="55" rx="8" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="26" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">INPUT FROM MODEL / AGENT</text>
    <text x="200" y="44" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="500">Tool invocation: tools/call verify(claim)</text>
  </g>

  <!-- Down Arrow -->
  <path d="M 450 150 L 450 180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="445,178 455,178 450,186" fill="#38bdf8"/>

  <!-- Deterministic Engine Boundary -->
  <rect x="70" y="190" width="760" height="280" rx="12" fill="#0b1329" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <rect x="90" y="178" width="460" height="24" rx="4" fill="#065f46"/>
  <text x="320" y="194" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700" letter-spacing="0.8">⚡ MCP-REDLINE ENGINE — ZERO LANGUAGE MODELS (100% DETERMINISTIC)</text>

  <!-- Internal Step 1 -->
  <g transform="translate(100, 220)">
    <rect width="320" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="160" y="24" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">1. EXTRACT ENTITIES &amp; NUMBERS</text>
    <text x="160" y="40" text-anchor="middle" fill="#cbd5e1" font-size="11">Amounts, currencies, dates, key legal concepts</text>
  </g>

  <!-- Internal Step 2 -->
  <g transform="translate(480, 220)">
    <rect width="320" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="160" y="24" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">2. AUTHORITY HIERARCHY</text>
    <text x="160" y="40" text-anchor="middle" fill="#cbd5e1" font-size="11">Tier 1: MSA, Invoices, P&amp;L &gt; Tier 3: Emails</text>
  </g>

  <!-- Internal Step 3 Decision -->
  <g transform="translate(260, 295)">
    <polygon points="190,0 380,35 190,70 0,35" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="190" y="32" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">Contractual contradiction or</text>
    <text x="190" y="46" text-anchor="middle" fill="#fbbf24" font-size="10">stricken clause detected in agreement?</text>
  </g>

  <!-- Connectors from 1 & 2 to 3 -->
  <path d="M 260 270 L 260 330" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 640 270 L 640 330 L 450 330" stroke="#64748b" stroke-width="1.5"/>

  <!-- Decision Branches -->
  <path d="M 450 365 L 450 395 L 300 395" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="302,391 302,399 294,395" fill="#ef4444"/>
  <text x="375" y="388" fill="#f87171" font-size="10" font-weight="700">YES (e.g. barred CPI)</text>

  <path d="M 450 365 L 450 395 L 600 395" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="598,391 598,399 606,395" fill="#10b981"/>
  <text x="490" y="388" fill="#34d399" font-size="10" font-weight="700">NO (Evaluate coverage)</text>

  <!-- Condition boxes -->
  <g transform="translate(100, 410)">
    <rect width="260" height="45" rx="6" fill="#1e1b2e" stroke="#ef4444" stroke-width="1"/>
    <text x="130" y="22" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">CONTRACTUAL CONTRADICTION</text>
    <text x="130" y="36" text-anchor="middle" fill="#fecaca" font-size="9">Direct conflict with exclusionary clause</text>
  </g>

  <g transform="translate(540, 410)">
    <rect width="260" height="45" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="130" y="22" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="600">EXACT EVIDENCE MATCH</text>
    <text x="130" y="36" text-anchor="middle" fill="#d1fae5" font-size="9">Discrete numbers + concept coverage &gt;= 45%</text>
  </g>

  <!-- Down Connectors to Results -->
  <path d="M 230 455 L 230 500" stroke="#ef4444" stroke-width="2"/>
  <polygon points="225,498 235,498 230,506" fill="#ef4444"/>

  <path d="M 670 455 L 670 500" stroke="#10b981" stroke-width="2"/>
  <polygon points="665,498 675,498 670,506" fill="#10b981"/>

  <!-- Output 1: CONTRADICTED / UNSUPPORTED -->
  <g transform="translate(80, 510)" filter="url(#shadow)">
    <rect width="320" height="70" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#7f1d1d"/>
    <text x="35" y="41" text-anchor="middle" fill="#fecaca" font-size="18" font-weight="bold">✕</text>
    <text x="65" y="30" fill="#fca5a5" font-size="12.5" font-weight="800">STATUS: CONTRADICTED / UNSUPPORTED</text>
    <text x="65" y="47" fill="#fecaca" font-size="10.5">Explicit refusal to hallucinate</text>
    <text x="65" y="60" fill="#fca5a5" font-size="9.5">+ verbatim exclusionary clause quote</text>
  </g>

  <!-- Output 2: GROUNDED -->
  <g transform="translate(500, 510)" filter="url(#shadow)">
    <rect width="320" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#047857"/>
    <text x="35" y="41" text-anchor="middle" fill="#d1fae5" font-size="18" font-weight="bold">✓</text>
    <text x="65" y="30" fill="#6ee7b7" font-size="13" font-weight="800">STATUS: GROUNDED</text>
    <text x="65" y="47" fill="#d1fae5" font-size="10.5">100% verified against source</text>
    <text x="65" y="60" fill="#a7f3d0" font-size="9.5">+ exact file, page number, and quote</text>
  </g>
</svg>
