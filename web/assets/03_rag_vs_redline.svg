<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="badCol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1f0707" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="goodCol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadowC" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="470" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">DIAGRAM 3: PORÓWNANIE ARCHITEKTUR</text>
  <text x="470" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Tradycyjny RAG z syntezą LLM vs Deterministyczny audyt weryfikacyjny mcp-redline</text>

  <!-- Top Prompt Box -->
  <g transform="translate(190, 85)" filter="url(#shadowC)">
    <rect width="560" height="50" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="280" y="22" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">TESTOWANE PYTANIE ZARZĄDU / CISO</text>
    <text x="280" y="39" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">"Czy dostawca ma prawo jednostronnie podnieść ceny o 7.5% UK CPI od stycznia?"</text>
  </g>

  <!-- Branch lines -->
  <path d="M 330 135 L 240 170" stroke="#ef4444" stroke-width="2"/>
  <polygon points="237,163 247,168 238,175" fill="#ef4444"/>

  <path d="M 610 135 L 700 170" stroke="#10b981" stroke-width="2"/>
  <polygon points="702,163 693,168 702,175" fill="#10b981"/>

  <!-- Left Column: Standard RAG -->
  <g transform="translate(30, 175)" filter="url(#shadowC)">
    <rect width="420" height="370" rx="12" fill="url(#badCol)" stroke="#ef4444" stroke-width="2"/>
    <rect x="20" y="-12" width="280" height="24" rx="4" fill="#7f1d1d"/>
    <text x="160" y="4" text-anchor="middle" fill="#fee2e2" font-size="11" font-weight="700">❌ TRADYCYJNY RAG (ILUZJA ZAUFANIA)</text>

    <!-- Step 1 -->
    <g transform="translate(20, 30)">
      <rect width="380" height="50" rx="6" fill="#1a0d0d" stroke="#ef4444" stroke-width="0.8"/>
      <text x="15" y="22" fill="#fca5a5" font-size="11" font-weight="700">1. Wyszukiwanie wektorowe (Top-K)</text>
      <text x="15" y="38" fill="#fecaca" font-size="10">Zwraca najbardziej podobny semantycznie fragment: mail handlowca</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 95)">
      <rect width="380" height="50" rx="6" fill="#1a0d0d" stroke="#ef4444" stroke-width="0.8"/>
      <text x="15" y="22" fill="#fca5a5" font-size="11" font-weight="700">2. Generacja / Synteza przez model LLM</text>
      <text x="15" y="38" fill="#fecaca" font-size="10">Model syntetyzuje odpowiedź na podstawie znalezionego maila</text>
    </g>

    <!-- Step 3: Hallucination -->
    <g transform="translate(20, 160)">
      <rect width="380" height="85" rx="6" fill="#2d0f11" stroke="#ef4444" stroke-width="1.5"/>
      <text x="15" y="22" fill="#f87171" font-size="11" font-weight="800">3. PEWNA SIEBIE HALUCYNACJA:</text>
      <text x="15" y="40" fill="#fca5a5" font-size="10.5" font-style="italic">"Tak, zgodnie z Section 8.2 umowy dostawca wysłał</text>
      <text x="15" y="55" fill="#fca5a5" font-size="10.5" font-style="italic">zawiadomienie o indeksacji o 7.5% UK CPI..."</text>
      <text x="15" y="74" fill="#ef4444" font-size="9.5" font-weight="600">Model uwierzył w maila i nie zauważył wykreślenia w umowie!</text>
    </g>

    <!-- Consequence -->
    <g transform="translate(20, 260)">
      <rect width="380" height="50" rx="6" fill="#7f1d1d"/>
      <text x="190" y="22" text-anchor="middle" fill="#fee2e2" font-size="11" font-weight="800">SKUTEK DLA BIZNESU</text>
      <text x="190" y="38" text-anchor="middle" fill="#fecaca" font-size="10">Niepotrzebna nadpłata, błąd w budżecie, strata finansowa</text>
    </g>
  </g>

  <!-- Right Column: mcp-redline -->
  <g transform="translate(490, 175)" filter="url(#shadowC)">
    <rect width="420" height="370" rx="12" fill="url(#goodCol)" stroke="#10b981" stroke-width="2"/>
    <rect x="20" y="-12" width="280" height="24" rx="4" fill="#065f46"/>
    <text x="160" y="4" text-anchor="middle" fill="#d1fae5" font-size="11" font-weight="700">✓ MCP-REDLINE (DETERMINISTYCZNY AUDYT)</text>

    <!-- Step 1 -->
    <g transform="translate(20, 30)">
      <rect width="380" height="50" rx="6" fill="#042017" stroke="#10b981" stroke-width="0.8"/>
      <text x="15" y="22" fill="#34d399" font-size="11" font-weight="700">1. Hierarchia autorytatywności (Authority Tiers)</text>
      <text x="15" y="38" fill="#a7f3d0" font-size="10">Podpisana umowa MSA (Tier 1) unieważnia jednostronne maile (Tier 3)</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 95)">
      <rect width="380" height="50" rx="6" fill="#042017" stroke="#10b981" stroke-width="0.8"/>
      <text x="15" y="22" fill="#34d399" font-size="11" font-weight="700">2. Wykrywanie sprzeczności i wykreśleń</text>
      <text x="15" y="38" fill="#a7f3d0" font-size="10">Wykrycie wykreślonej klauzuli waloryzacji i sankcji null and void</text>
    </g>

    <!-- Step 3: Refusal -->
    <g transform="translate(20, 160)">
      <rect width="380" height="85" rx="6" fill="#063826" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" fill="#6ee7b7" font-size="11" font-weight="800">3. TWARDA DETERMINISTYCZNA ODMOWA:</text>
      <text x="15" y="40" fill="#d1fae5" font-size="10.5" font-weight="700">STATUS: UNSUPPORTED</text>
      <text x="15" y="55" fill="#a7f3d0" font-size="10">"Section 8.2 MSA wprost zakazuje jednostronnej waloryzacji,</text>
      <text x="15" y="70" fill="#a7f3d0" font-size="10">a jednostronne pismo dostawcy jest nieważne z mocy prawa."</text>
    </g>

    <!-- Consequence -->
    <g transform="translate(20, 260)">
      <rect width="380" height="50" rx="6" fill="#047857"/>
      <text x="190" y="22" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="800">SKUTEK DLA BIZNESU</text>
      <text x="190" y="38" text-anchor="middle" fill="#d1fae5" font-size="10">Skuteczna obrona przed roszczeniem, 100% zgodność z prawem</text>
    </g>
  </g>
</svg>
